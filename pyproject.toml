[project]
name = "boole-lang"
version = "0.1.0"
description = "Boole — Python-like language with gradual typing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Boole contributors" }]

[project.scripts]
boole = "boole.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boole*"]
